<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardStorming</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="heading">
        <h1>CardStorming</h1>
        <div class="project-name-section">
            <input type="text" id="project-name" class="project-name-input" value="Unnamed Project" spellcheck="false">
            <button id="share-btn" class="share-button" title="Share this project">📤 Share</button>
        </div>
        <p class="welcome-text" id="welcome-text">Welcome to your collaborative workspace</p>
    </div>

    <div class="menu-bar">
        <div class="menu-left">
            <div class="menu-item">
                <button class="menu-button">File</button>
                <div class="dropdown-content">
                    <a href="#" id="menu-new">New</a>
                    <div class="submenu-container">
                        <a href="#" id="menu-open" class="has-submenu">Open ›</a>
                        <div class="submenu-content" id="open-submenu">
                            <!-- Projects will be dynamically inserted here -->
                        </div>
                    </div>
                    <div class="submenu-container">
                        <a href="#" id="menu-delete" class="has-submenu">Delete ›</a>
                        <div class="submenu-content">
                            <a href="#" id="menu-delete-cards">All Cards</a>
                            <a href="#" id="menu-delete-palette">Palette</a>
                            <a href="#" id="menu-delete-project">Project</a>
                        </div>
                    </div>
                    <a href="#" id="menu-leave-project">Leave Project</a>
                    <a href="#" id="menu-close">Close</a>
                    <a href="#" id="menu-exit">Exit</a>
                </div>
            </div>
            <div class="menu-item">
                <button class="menu-button">Help</button>
                <div class="dropdown-content">
                    <a href="#" id="menu-show-log">Show Log</a>
                    <a href="#" id="menu-about">About</a>
                </div>
            </div>
        </div>
        <div class="zoom-controls">
            <button id="zoom-search-btn" class="zoom-button zoom-icon-button" title="Zoom to Fit">
                <img src="/images/zoom-in-search.svg" alt="Zoom to Fit" class="zoom-icon">
            </button>
            <button id="wormhole-btn" class="zoom-button zoom-icon-button" title="Wormhole">
                <img src="/images/wormhole.svg" alt="Wormhole" class="zoom-icon">
            </button>
            <button id="zoom-out-btn" class="zoom-button" title="Zoom Out">−</button>
            <button id="zoom-in-btn" class="zoom-button" title="Zoom In">+</button>
            <button id="center-btn" class="zoom-button" title="Center View">⊙</button>
            <div id="viewport-coordinates" class="viewport-coordinates">0, 0</div>
        </div>
    </div>

    <div class="main-container">
        <div class="viewport">
            <div class="viewport-content"></div>
        </div>
        <div class="palette">
            <button id="add-card-btn" class="add-card-button">
                <span class="plus-sign">+</span>
                <img src="/images/stacked-cards.svg" alt="Cards" class="cards-icon">
            </button>
            <div id="card-list"></div>
        </div>
    </div>

    <!-- Card Creation Modal -->
    <div id="card-modal" class="modal">
        <div class="modal-content">
            <h2>Create Card</h2>
            <label for="card-type">Card Type:</label>
            <input type="text" id="card-type" placeholder="Enter card type name">

            <label>Background Color:</label>
            <div class="color-picker-container">
                <canvas id="color-wheel" width="200" height="200"></canvas>
                <div class="color-preview" id="color-preview"></div>
            </div>

            <div class="modal-buttons">
                <button id="modal-ok">OK</button>
                <button id="modal-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Card Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content edit-card-container">
            <div class="edit-card-visual" id="edit-card-visual">
                <div class="edit-card-header" id="edit-card-header" contenteditable="true" data-placeholder="Header"></div>
                <div class="edit-card-body" id="edit-card-body" contenteditable="true" data-placeholder="Body text..."></div>
            </div>
            <div class="edit-button-row">
                <button id="edit-delete" class="edit-delete-btn">&#128465;</button>
                <button id="edit-close" class="edit-close-btn">&times;</button>
                <button id="edit-save" class="edit-save-btn">&#10003;</button>
            </div>
        </div>
    </div>

    <!-- Share Dialog -->
    <div id="share-modal" class="modal">
        <div class="modal-content">
            <h2>Share Project</h2>
            <div id="share-message" class="share-message"></div>
            <div class="modal-buttons">
                <button id="share-copy-text">Copy Text</button>
                <button id="share-copy-link">Copy Link</button>
                <button id="share-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Identity Selection Dialog -->
    <div id="identity-modal" class="modal">
        <div class="modal-content">
            <h2 id="identity-modal-title">Select Identity</h2>
            <p id="identity-modal-message"></p>
            <div id="identity-options" class="identity-options">
                <!-- Radio buttons will be added dynamically -->
            </div>
            <div id="identity-other-fields" class="identity-other-fields" style="display: none;">
                <label for="identity-name">Name:</label>
                <input type="text" id="identity-name" placeholder="Full Name">
                <label for="identity-initials">Initials:</label>
                <input type="text" id="identity-initials" placeholder="ABC" maxlength="4">
            </div>
            <div id="identity-error" class="identity-error" style="display: none;"></div>
            <div class="modal-buttons">
                <button id="identity-ok">OK</button>
                <button id="identity-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- User Registration Dialog -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <h2>Register</h2>
            <p id="register-message">To continue, please register:</p>
            <div class="register-fields">
                <label for="register-email">Email:</label>
                <input type="email" id="register-email" placeholder="your@email.com" required>
                <label for="register-name">Name:</label>
                <input type="text" id="register-name" placeholder="Full Name" required>
                <label for="register-initials">Initials:</label>
                <input type="text" id="register-initials" placeholder="ABC" maxlength="4" required>
            </div>
            <div id="register-error" class="register-error" style="display: none;"></div>
            <div class="modal-buttons">
                <button id="register-ok">Register</button>
                <button id="register-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Debug Log Dialog -->
    <div id="log-modal" class="modal">
        <div class="modal-content log-modal-content">
            <h2>Debug Log</h2>
            <div id="log-content" class="log-content"></div>
            <div class="modal-buttons">
                <button id="log-mute">Mute</button>
                <button id="log-copy">Copy All</button>
                <button id="log-clear">Clear Log</button>
                <button id="log-close">Close</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
