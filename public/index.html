<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardStorming</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="heading">
        <h1>CardStorming</h1>
        <p>Welcome to your collaborative workspace</p>
    </div>

    <div class="menu-bar">
        <div class="menu-item">
            <button class="menu-button">File</button>
            <div class="dropdown-content">
                <a href="#" id="menu-exit">Exit</a>
            </div>
        </div>
        <div class="menu-item">
            <button class="menu-button">Help</button>
            <div class="dropdown-content">
                <a href="#" id="menu-about">About</a>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="viewport">
        </div>
        <div class="palette">
            <button id="add-card-btn" class="add-card-button">+</button>
            <h3>Palette</h3>
            <div id="card-list"></div>
        </div>
    </div>

    <!-- Card Creation Modal -->
    <div id="card-modal" class="modal">
        <div class="modal-content">
            <h2>Create Card</h2>
            <label for="card-type">Card Type:</label>
            <input type="text" id="card-type" placeholder="Enter card type name">

            <label for="card-color">Background Color:</label>
            <select id="card-color">
                <option value="#fff9c4">Yellow</option>
                <option value="#ffccbc">Orange</option>
                <option value="#f8bbd0">Pink</option>
                <option value="#e1bee7">Purple</option>
                <option value="#c5cae9">Blue</option>
                <option value="#b2dfdb">Teal</option>
                <option value="#c8e6c9">Green</option>
                <option value="#ffffff">White</option>
            </select>

            <div class="modal-buttons">
                <button id="modal-ok">OK</button>
                <button id="modal-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Card Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h2>Edit Card</h2>
            <label for="card-header">Header:</label>
            <input type="text" id="card-header" placeholder="Enter card header">

            <label for="card-body">Body:</label>
            <textarea id="card-body" rows="5" placeholder="Enter card body text"></textarea>

            <div class="modal-buttons">
                <button id="edit-ok">OK</button>
                <button id="edit-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
