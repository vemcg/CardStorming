<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Concentric rings (target) -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>

  <!-- 8 spokes - wider at edges, narrower at center -->

  <!-- Spoke 1: 0° (horizontal right) -->
  <path d="M 60 31 L 34 31.7 L 34 32.3 L 60 33 Z" fill="currentColor"/>

  <!-- Spoke 2: 45° -->
  <path d="M 53 11 L 35 30 L 35.5 30.5 L 54.5 12.5 Z" fill="currentColor"/>

  <!-- Spoke 3: 90° (vertical up) -->
  <path d="M 31 4 L 31.7 30 L 32.3 30 L 33 4 Z" fill="currentColor"/>

  <!-- Spoke 4: 135° -->
  <path d="M 11 11 L 30 30 L 30.5 29.5 L 12.5 9.5 Z" fill="currentColor"/>

  <!-- Spoke 5: 180° (horizontal left) -->
  <path d="M 4 31 L 30 31.7 L 30 32.3 L 4 33 Z" fill="currentColor"/>

  <!-- Spoke 6: 225° -->
  <path d="M 11 53 L 30 34 L 29.5 33.5 L 9.5 51.5 Z" fill="currentColor"/>

  <!-- Spoke 7: 270° (vertical down) -->
  <path d="M 31 60 L 31.7 34 L 32.3 34 L 33 60 Z" fill="currentColor"/>

  <!-- Spoke 8: 315° -->
  <path d="M 53 53 L 34 34 L 33.5 34.5 L 51.5 54.5 Z" fill="currentColor"/>
</svg>
