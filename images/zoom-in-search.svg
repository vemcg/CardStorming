<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Magnifying glass circle (upper right) -->
  <circle cx="38" cy="26" r="16" fill="none" stroke="currentColor" stroke-width="5"/>

  <!-- Handle (angled to lower left) -->
  <line x1="26" y1="38" x2="10" y2="54" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>

  <!-- Plus sign inside the circle -->
  <!-- Vertical line of + -->
  <line x1="38" y1="19" x2="38" y2="33" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <!-- Horizontal line of + -->
  <line x1="31" y1="26" x2="45" y2="26" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
</svg>
