           C 52 6, 60 16, 60 28
           C 60 38, 54 46, 45 50
           C 38 53, 30 51, 26 45
           C 23 40, 24 34, 28 31"
        fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Spiral arm 2 - starts from bottom right area -->
